<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cozy Room — Walkable 3D Space</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1520; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  #enter {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(26,21,32,0.55) 0%, rgba(26,21,32,0.88) 100%);
    color: #f3e9d7; font-family: Georgia, 'Times New Roman', serif;
    cursor: pointer; user-select: none; text-align: center;
    transition: opacity .45s ease;
  }
  #enter.hidden { opacity: 0; pointer-events: none; }
  #enter h1 { font-size: clamp(28px, 5vw, 52px); font-weight: normal; letter-spacing: .12em; margin-bottom: 10px; }
  #enter p.sub { font-size: 15px; letter-spacing: .28em; text-transform: uppercase; color: #c9a97a; margin-bottom: 34px; }
  #enter .btn {
    border: 1px solid rgba(243,233,215,.45); padding: 14px 42px; border-radius: 40px;
    font-size: 15px; letter-spacing: .22em; text-transform: uppercase;
    background: rgba(243,233,215,.07);
  }
  #enter:hover .btn { background: rgba(243,233,215,.16); }
  #enter .keys { margin-top: 30px; font-size: 13px; color: rgba(243,233,215,.6); letter-spacing: .1em; line-height: 1.9; }
  #enter .keys b { color: #e8cf9f; font-weight: normal; }

  #hud {
    position: fixed; top: 18px; left: 20px; z-index: 5;
    font-family: Georgia, serif; color: rgba(243,233,215,.85);
    pointer-events: none; text-shadow: 0 1px 4px rgba(0,0,0,.6);
    opacity: 0; transition: opacity .6s ease;
  }
  #hud.visible { opacity: 1; }
  #hud .title { font-size: 17px; letter-spacing: .2em; color: #f3e9d7; }

  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 5; font-family: Georgia, serif; font-size: 12px; letter-spacing: .14em;
    color: rgba(243,233,215,.55); pointer-events: none; white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0,0,0,.7);
    opacity: 0; transition: opacity .6s ease;
  }
  #hint.visible { opacity: 1; }

  #joy {
    position: fixed; width: 120px; height: 120px; border-radius: 50%;
    border: 2px solid rgba(243,233,215,.35); background: rgba(243,233,215,.07);
    display: none; z-index: 8; pointer-events: none;
    transform: translate(-50%, -50%);
  }
  #joyknob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px;
    border-radius: 50%; background: rgba(243,233,215,.45);
    transform: translate(-50%, -50%);
  }
  #tbtns {
    position: fixed; right: 16px; bottom: 26px; z-index: 8;
    display: none; flex-direction: column; gap: 12px; align-items: center;
  }
  #tbtns.visible { display: flex; }
  .tbtn {
    width: 62px; height: 62px; border-radius: 50%;
    border: 1.5px solid rgba(243,233,215,.45); background: rgba(26,21,32,.45);
    color: #f3e9d7; font-family: Georgia, serif; font-size: 10px; letter-spacing: .1em;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  .tbtn.on { background: rgba(201,169,122,.55); }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<div id="app"></div>

<div id="joy"><div id="joyknob"></div></div>
<div id="tbtns">
  <div class="tbtn" id="btn-cam">CAM</div>
  <div class="tbtn" id="btn-run">RUN</div>
  <div class="tbtn" id="btn-jump">JUMP</div>
</div>

<div id="hud"><span class="title">C O Z Y &nbsp; R O O M</span></div>
<div id="hint">WASD move &nbsp;·&nbsp; Mouse look &nbsp;·&nbsp; Shift run &nbsp;·&nbsp; Space jump &nbsp;·&nbsp; V camera &nbsp;·&nbsp; Esc release</div>

<div id="enter">
  <h1>Cozy Room</h1>
  <p class="sub">a walkable space</p>
  <div class="btn">Click to enter</div>
  <div class="keys">
    <b>W A S D</b> walk &nbsp;·&nbsp; <b>mouse</b> look &nbsp;·&nbsp; <b>shift</b> run<br>
    <b>space</b> jump &nbsp;·&nbsp; <b>V</b> first / third person &nbsp;·&nbsp; <b>esc</b> release mouse
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
